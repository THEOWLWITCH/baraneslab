name: Model8 MICrONS PR analysis

on:
  pull_request:
    branches: [main]
    paths:
      - 'analysis/**'
      - '.github/workflows/model8-analysis-pr.yml'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy scikit-learn requests h5py pyarrow meshparty
      - name: Run analysis
        run: |
          if [ -f analysis/model8_microns_analysis.py ]; then
            python analysis/model8_microns_analysis.py
          else
            python analysis/model8_microns_diagnostic.py
          fi
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model8-microns-results
          path: model8_microns_results/
          if-no-files-found: warn
